<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Noah: Way Home</title>
  <meta name="description" content="A cooperative trivia adventure. Help Noah, a lost sketch of a boy with a red balloon, find his way home.">
  <meta name="theme-color" content="#efe8da">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cellipse cx=%2716%27 cy=%2712%27 rx=%279%27 ry=%2711%27 fill=%27%23c0392b%27/%3E%3Cpath d=%27M16 23 Q13 27 17 31%27 stroke=%27%232c2723%27 fill=%27none%27/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="defs"></div>
  <div class="paper"></div>
  <main id="app" aria-live="polite"></main>
  <noscript>Noah needs JavaScript to find his way home.</noscript>
  <!-- js/app.js and css/app.css are built from js/*.js and css/style.css by tools/build.mjs,
       down-levelled so older smart-TV browsers can run the game. -->
  <script>
    // If the game can't start on this browser (e.g. a very old smart TV), say so instead of showing a blank page.
    window.addEventListener('error', function (e) {
      var app = document.getElementById('app');
      if (app && !app.children.length) app.innerHTML = '<div style="max-width:560px;margin:15vh auto;padding:24px;text-align:center;font:20px/1.4 sans-serif;color:#2c2723">' +
        '<h1 style="font-size:32px;margin-bottom:12px">Noah can\'t start on this browser</h1>' +
        '<p>This TV\'s browser is too old for the game. Try opening it on a laptop connected to the TV, or cast a Chrome tab.</p>' +
        '<p style="margin-top:16px;font-size:14px;color:#8b8478">' + String(e.message || 'Script error').replace(/</g, '&lt;') + '</p></div>';
    });
  </script>
  <script src="js/app.js" defer></script>
</body>
</html>
